<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>About | Afgan</title>
    <link rel="stylesheet" href="style.css">
    <link rel='website icon' type='png' href='logo.png'>
</head>

<body>
    <!-- ================= INTRO ================= -->
    <div id="intro">
        <h1 class="title">AFGAN</h1>
        <p class="subtitle">personal | website</p>

        <!-- loading bar -->
        <div class="loader">
            <span></span>
        </div>
    </div>
    <!-- ========================================= -->


    <!-- ================= MAIN WEBSITE ================= -->
    <div id="main">
        <!-- NAVBAR -->
        <nav class="navbar">
            <div class="logo">Aa</div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="diri.html">About</a></li>
                <li><a href="projek.html">Project</a></li>
                <li><a href="kontak.html">Contact</a></li>
            </ul>
        </nav>

        <section class="hero">
            <div class="hero-left">
                <h1>
                    Hello, <span id="typing"></span>
                </h1>
                <p class="hero-sub">
                    Selamat datang di website pribadi saya. Di sini saya berbagi tentang diri saya, karya, dan
                    perjalanan yang sedang saya jalani.
                </p>

                <a href="diri.html" class="btn hero-btn">About Me</a>
            </div>

            <div class="hero-right">
                <img src="img/idx.png" alt="Afgan">
            </div>
        </section>
    </div>
    <!-- =============================================== -->
    <script>
        const text = "I'm Afgan";
        const typingEl = document.getElementById("typing");

        let index = 0;
        let isDeleting = false;

        function typeLoop() {
            if (!isDeleting) {
                // ngetik
                typingEl.textContent = text.substring(0, index + 1);
                index++;

                if (index === text.length) {
                    setTimeout(() => isDeleting = true, 1200); // jeda sebelum hapus
                }
            } else {
                // hapus
                typingEl.textContent = text.substring(0, index - 1);
                index--;

                if (index === 0) {
                    isDeleting = false;
                }
            }

            const speed = isDeleting ? 80 : 120;
            setTimeout(typeLoop, speed);
        }

        typeLoop();
    </script>

    <!-- FOOTER -->
    <footer>
        © 2026 Afgan. All rights reserved.
    </footer>

    <!-- ================= SCRIPT ================= -->
    <script>
        /*
            Alur script:
            1. Tunggu intro selesai
            2. Fade out intro
            3. Tampilkan main content
        */

        setTimeout(() => {
            const intro = document.getElementById("intro");
            const main = document.getElementById("main");

            intro.style.opacity = "0";

            setTimeout(() => {
                intro.style.display = "none";
                main.style.display = "block";
                document.body.style.overflow = "auto"; // 🔒 tetap dikunci
            }, 800);

        }, 3500);
    </script>
    <!-- ========================================= -->

</body>

</html>
